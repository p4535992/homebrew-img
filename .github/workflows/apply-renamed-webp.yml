name: Apply renamed WebP images

on:
  pull_request:
    branches:
      - update/renaming-images-2026

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/apply-renamed-webp-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout involved image folders
        uses: actions/checkout@v4
        with:
          ref: agent/apply-renamed-webp-20260801
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            .github/workflows
            img/ATBOH
            img/AngryGolemGamesMonsterManual
            img/AngryGolemGamesMonsterManual2
            img/AngryGolemGamesMonsterManual3
            img/ArmiesOfWar
            img/BWWW
            img/CCORCSAA
            img/COMAberration
            img/COMAberrationLegendary
            img/COMCelestial
            img/COMCelestialLegendary
            img/COMConstruct
            img/COMCreature
            img/COMDevil
            img/COMElementalLegendary
            img/COMItems
            img/COMOrc
            img/COMRavenloft
            img/COMUndeadLegendary
            img/DLRG
            img/DMPG
            img/DMSGuildRavenloft
            img/DarkSunCreatureCatalog
            img/Darklords&DomainsVol1
            img/DeitiesAventyr
            img/DeitiesClaybough
            img/HOLOLIVE
            img/IVSO
            img/KGFD
            img/LOD5HLV
            img/MistfactorPressDarklords&Domains
            img/NS-TSDO
            img/ROTSSPGF
            img/SEIISL
            img/SLESP
            img/UBCOS
            img/VTCR
            img/WBBCD
            img/WRSTONW
            img/WitchWBN
            img/atweapons

      - name: Download and apply verified image package
        env:
          PACKAGE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-57d0-81f4-81a9-1a23c455ce7d/raw?se=2026-08-01T11:55:20Z&sp=r&sv=2026-02-06&sr=b&scid=21eefb1b-3df9-5f18-9dd0-64a4a30175a1&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T05:17:51Z&ske=2026-08-02T05:17:51Z&sks=b&skv=2026-02-06&sig=bBc1NuBH6hJPQRRLsQpCDdDeI20dAibHigGb3jyuiJw%3D"
          PACKAGE_SHA256: "698d65f1b8ce4e3738de3593468f4a1ea7b2e5c1021d24e62a7768d4cb2dcab3"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$PACKAGE_URL" --output package.zip
          echo "$PACKAGE_SHA256  package.zip" | sha256sum --check -
          mkdir package
          unzip -q package.zip -d package
          cp -a package/changes/. ./

          while IFS= read -r old_path; do
            [[ -z "$old_path" ]] && continue
            rm -f -- "$old_path"
          done < package/delete-old-paths.txt

          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('package/report.json').read_text(encoding='utf-8'))
          mappings = report['mappings']
          if len(mappings) != 2353:
              raise SystemExit(f'Expected 2353 mappings, got {len(mappings)}')
          if report.get('unique_new_files') != 2187:
              raise SystemExit(f"Expected 2187 new files, got {report.get('unique_new_files')}")
          for mapping in mappings:
              old_path = Path(mapping['old'])
              new_path = Path(mapping['new'])
              if old_path.exists():
                  raise SystemExit(f'Old Imgur file still exists: {old_path}')
              if not new_path.is_file():
                  raise SystemExit(f'Missing renamed WebP: {new_path}')
              if new_path.suffix.lower() != '.webp':
                  raise SystemExit(f'Unexpected target extension: {new_path}')
          print(f'Validated {len(mappings)} replacements and {report["unique_new_files"]} unique WebP files')
          PY

          rm -rf package package.zip
          rm -f .github/workflows/apply-renamed-webp.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Replace Imgur imports with named WebP images"
          git push origin HEAD:agent/apply-renamed-webp-20260801
