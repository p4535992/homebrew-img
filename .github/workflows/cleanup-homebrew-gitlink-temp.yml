name: Remove temporary homebrew gitlink

on:
  pull_request:
    branches:
      - update/renaming-images-2026
    paths:
      - .github/workflows/cleanup-homebrew-gitlink-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            _homebrew
          sparse-checkout-cone-mode: false

      - name: Remove temporary gitlink and workflow
        run: |
          git rm -f _homebrew
          git rm -f .github/workflows/cleanup-homebrew-gitlink-temp.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary homebrew checkout gitlink"
          git push origin HEAD:${{ github.head_ref }}
