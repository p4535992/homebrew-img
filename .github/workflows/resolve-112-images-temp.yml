name: Resolve 112 legacy images

on:
  pull_request:
    branches:
      - update/renaming-images-2026
    paths:
      - .github/workflows/resolve-112-images-temp.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Checkout homebrew JSON branch
        uses: actions/checkout@v4
        with:
          repository: p4535992/homebrew
          ref: update/renaming-images-2026
          path: _homebrew
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate named WebP assets
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote
          from PIL import Image

          FOLDERS = {
              "Darklords&DomainsVol1",
              "ROTSSPGF",
              "ATBOH",
              "KGFD",
              "SEIISL",
              "AngryGolemGamesMonsterManual",
              "COMOrc",
              "COMItems",
          }
          URL_RE = re.compile(
              r"https://raw\.githubusercontent\.com/[^/]+/homebrew-img/[^/]+/img/([^/]+)/(.+?\.(?:jpg|jpeg|png))$",
              re.IGNORECASE,
          )

          def snake_name(value: str) -> str:
              value = value.replace("'", "").replace("’", "").replace("‘", "")
              value = re.sub(r"[()\[\]]", "", value)
              value = value.replace("-", "_").replace("/", "_").replace("\\", "_")
              value = re.sub(r"\s+", "_", value)
              value = re.sub(r"[^\w.]+", "_", value, flags=re.UNICODE)
              return re.sub(r"_+", "_", value).strip("_.")

          def infer_role(path):
              joined = ".".join(map(str, path)).lower()
              if "tokenurl" in joined or "tokenhref" in joined:
                  return "token"
              if ".cover." in f".{joined}." or joined.endswith("cover.url"):
                  return "cover"
              return "avatar"

          def nearest_name(stack, role, folder):
              if role == "cover" and folder == "ATBOH":
                  return "The Book of Hordes"
              for item in reversed(stack):
                  if not isinstance(item, dict):
                      continue
                  for key in ("name", "shortName", "title"):
                      value = item.get(key)
                      if isinstance(value, str) and value.strip():
                          return value.strip()
              raise RuntimeError("No JSON name found for image reference")

          occurrences = []

          def walk(node, path, stack, json_file):
              if isinstance(node, dict):
                  next_stack = stack + [node]
                  for key, value in node.items():
                      walk(value, path + [key], next_stack, json_file)
                  return
              if isinstance(node, list):
                  for index, value in enumerate(node):
                      walk(value, path + [index], stack, json_file)
                  return
              if not isinstance(node, str):
                  return
              match = URL_RE.match(node)
              if not match:
                  return
              folder = match.group(1)
              if folder not in FOLDERS:
                  return
              role = infer_role(path)
              name = nearest_name(stack, role, folder)
              source = Path("img") / folder / unquote(match.group(2))
              if role == "cover" and folder == "ATBOH":
                  target_name = "The_Book_of_Hordes_Cover.webp"
              else:
                  target_name = f"{snake_name(name)}_{role.capitalize()}.webp"
              target = Path("img") / folder / target_name
              occurrences.append({
                  "json_file": str(json_file.relative_to(Path("_homebrew"))),
                  "json_path": path,
                  "name": name,
                  "role": role,
                  "old_url": node,
                  "source": str(source),
                  "target": str(target),
              })

          for json_file in sorted(Path("_homebrew").rglob("*.json")):
              if "node_modules" in json_file.parts or ".git" in json_file.parts:
                  continue
              try:
                  data = json.loads(json_file.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue
              walk(data, [], [], json_file)

          targets = {}
          for item in occurrences:
              existing = targets.get(item["target"])
              if existing and existing != item["source"]:
                  raise SystemExit(f"Target collision: {item['target']}")
              targets[item["target"]] = item["source"]

          sources = sorted(set(targets.values()))
          if len(occurrences) != 112 or len(sources) != 73 or len(targets) != 100:
              raise SystemExit(
                  f"Unexpected mapping counts: occurrences={len(occurrences)}, "
                  f"sources={len(sources)}, targets={len(targets)}"
              )

          missing = [source for source in sources if not Path(source).is_file()]
          if missing:
              raise SystemExit("Missing legacy sources:\n" + "\n".join(missing))

          preexisting = [target for target in targets if Path(target).exists()]
          if preexisting:
              raise SystemExit("Named targets already exist:\n" + "\n".join(preexisting))

          transparent = 0
          for target_text, source_text in sorted(targets.items()):
              source = Path(source_text)
              target = Path(target_text)
              target.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(source) as image:
                  image.load()
                  has_alpha = (
                      image.mode in {"RGBA", "LA"}
                      or (image.mode == "P" and "transparency" in image.info)
                  )
                  if has_alpha:
                      image.convert("RGBA").save(
                          target,
                          format="WEBP",
                          lossless=True,
                          method=6,
                      )
                      transparent += 1
                  else:
                      image.convert("RGB").save(
                          target,
                          format="WEBP",
                          quality=95,
                          method=6,
                      )
              with Image.open(target) as check:
                  if check.format != "WEBP":
                      raise SystemExit(f"Invalid WebP output: {target}")

          for source_text in sources:
              Path(source_text).unlink()

          report = {
              "occurrences_resolved": len(occurrences),
              "legacy_sources_removed": len(sources),
              "webp_files_created": len(targets),
              "transparent_webp_files": transparent,
              "occurrences": occurrences,
          }
          Path("/tmp/resolve-112-images-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          lines = [
              "# Resolve 112 legacy images",
              "",
              f"- Occurrences resolved: **{len(occurrences)}**",
              f"- Legacy JPG/JPEG/PNG files removed: **{len(sources)}**",
              f"- Named WebP files created: **{len(targets)}**",
              f"- Transparent WebP files: **{transparent}**",
              "",
              "| JSON object | Role | Legacy source | Named WebP |",
              "|---|---|---|---|",
          ]
          for item in occurrences:
              lines.append(
                  f"| {item['name'].replace('|', '\\|')} | `{item['role']}` | "
                  f"`{item['source']}` | `{item['target']}` |"
              )
          Path("/tmp/resolve-112-images-report.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove temporary workflow
        run: git rm -f .github/workflows/resolve-112-images-temp.yml

      - name: Commit image corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve 112 legacy images with named WebP assets"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        with:
          name: resolve-112-images-report
          path: |
            /tmp/resolve-112-images-report.json
            /tmp/resolve-112-images-report.md
          retention-days: 7
