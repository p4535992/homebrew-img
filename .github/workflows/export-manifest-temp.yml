name: Migrate remaining images
on:
  pull_request:
    branches: [update/renaming-images-2026]
    paths: [.github/migration-export-trigger, .github/workflows/export-manifest-temp.yml]
permissions:
  contents: write
env:
  SOURCE_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-22ac-81f4-80ef-0726f6c669d2/raw?se=2026-08-01T17:20:38Z&sp=r&sv=2026-02-06&sr=b&scid=bc1128f8-e8e3-5bc0-befa-751ca74c1bdd&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T07:28:43Z&ske=2026-08-02T07:28:43Z&sks=b&skv=2026-02-06&sig=svqxLmDNPxVUVRD85ZXCjbzYX%2BsaqR8/km2mmY1p1s0%3D"
  MIGRATION_SCRIPT_ZLIB_B64: ""
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download source archive
        run: |
          curl --fail --location --retry 3 "$SOURCE_ARTIFACT_URL" -o /tmp/source.zip
          mkdir -p /tmp/source-artifact /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source-artifact
          tar -xf /tmp/source-artifact/homebrew-img.tar -C /tmp/source
      - name: Migrate images
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import base64,os,zlib
          open('/tmp/migrate.py','wb').write(zlib.decompress(base64.b64decode(os.environ['MIGRATION_SCRIPT_ZLIB_B64'])))
          PY
          python /tmp/migrate.py
      - name: Commit migration
        run: |
          rm -f .github/workflows/export-manifest-temp.yml .github/migration-export-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate remaining image folders to normalized WebP"
          git push origin "HEAD:${{ github.head_ref }}"
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-image-migration-report
          path: /tmp/image-migration-report.json
          retention-days: 7
